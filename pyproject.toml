[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "py2srbcyr"
version = "1.1.2"
description = "Transliteration of text in Croatian Latin into Serbian Cyrillic alphabet"
readme = "README.md"
authors = [
  { name="Strana (eng: Page)", email="zcprog+pypi@pm.me" }
]
requires-python = ">3.10"
license = "LGPL-3.0"
license-files = ["LICEN[CS]E*"]
keywords = ["py2srbcyr", "Serbia", "Serbian", "Cyrillic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.hatch.build.targets.sdist]
exclude = [
  "Makefile",
  "/cli",
  "plugin-*",
  "/.gitignore",
  "/rpmspec"
]

[tool.pytest]
minversion = "9.0"
testpaths = [
  "tests"
]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "check-wheel-contents>=0.6.3",
]
